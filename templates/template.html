<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="md-source-path" content="{{SOURCE_PATH}}">
	<title>{{TITLE}}</title>
	<!-- highlight.js テーマ：ライト/ダークを切替で使用 -->
	<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
	<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" disabled>
	<style>{{STYLE}}</style>
</head>
<body>
	<!-- ツールバー -->
	<div class="toolbar">
		<button id="refresh-btn" type="button" title="HTMLを再生成（mdtohtml:// プロトコル登録が必要）">↻</button>
		<button id="theme-toggle" type="button" title="テーマ切替">☾</button>
		<button id="sidebar-toggle" type="button" title="サイドバー開閉">☰</button>
		<button id="edit-toggle" type="button" title="編集モード切替">✎</button>
	</div>

	<!-- 編集レイアウト：プレビュー（左）+ スプリッター + エディタ（右） -->
	<div id="workspace">
		<main id="content" class="markdown-body" aria-busy="true"></main>
		<div id="splitter" role="separator" aria-orientation="vertical" tabindex="-1"></div>
		<div id="editor-pane">
			<div class="editor-actions">
				<button id="save-btn" type="button" title="保存（mdtohtml:// プロトコル登録が必要）">💾</button>
				<button id="edit-close-btn" type="button" title="編集を終了">×</button>
			</div>
			<textarea id="editor" spellcheck="false" aria-label="Markdown エディタ"></textarea>
		</div>
	</div>

	<!-- 右側フローティング目次 -->
	<aside id="sidebar" aria-label="目次">
		<nav id="toc"></nav>
	</aside>

	<!-- Markdownソース：HTMLエスケープ不要なよう script タグに格納 -->
	<script id="md-source" type="text/markdown">{{MARKDOWN}}</script>

	<!-- 外部ライブラリ（CDN） -->
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

	<!-- Mermaid（ESM）：読み込み完了後に window.mermaid へ公開し mermaid-ready を発火 -->
	<script type="module">
		import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.esm.min.mjs';
		mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
		window.mermaid = mermaid;
		window.dispatchEvent(new Event('mermaid-ready'));
	</script>

	<!-- アプリスクリプト -->
	<script>{{SCRIPT}}</script>
</body>
</html>
